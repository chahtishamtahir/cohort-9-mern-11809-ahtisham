# SonarQube Project Configuration for Notes App (NotionFlow)

# Unique project identification
sonar.projectKey=cohort-9-mern-11809-ahtisham-notes-app
sonar.projectName=Notes App (NotionFlow)
sonar.projectVersion=1.0.0

# Source directories to analyze
sonar.sources=backend/src,frontend/src

# Test directories
sonar.tests=backend/test

# Encoding
sonar.sourceEncoding=UTF-8

# Language settings
sonar.javascript.environments=nodejs,browser
sonar.javascript.node.maxspace=4096

# Inclusions and Exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/data/**,**/*.test.js,**/*.svg,**/*.png

# Test report integration
sonar.test.inclusions=backend/test/**/*.test.js
sonar.javascript.lcov.reportPaths=coverage/lcov.info
